[workspace]
resolver = "3"
members = ["crates/*"]
# Separate cargo-fuzz crate (nightly-only, never part of the normal build).
exclude = ["crates/gusset-store/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vgyy4/CAD"
authors = ["Gusset contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
mem_forget = "deny"

[workspace.dependencies]
libm = "0.2.16"
blake3 = "1.8.7"
directories = "6.0.0"
getrandom = "0.4.3"
trash = "5.2.9"
windows-sys = "0.61.2"
zstd = { version = "0.14.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
