[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vgyy4/CAD"
authors = ["Gusset contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
mem_forget = "deny"

[workspace.dependencies]
libm = "0.2.16"
blake3 = "1.8.7"
# gusset-hw: thread QoS/priority and sysctl FFI on Linux/Android/Apple (ADR 0011).
libc = "0.2.190"
# gusset-hw: EcoQoS (SetThreadInformation) and RAM query on Windows (ADR 0011).
windows-sys = "0.61.2"
cc = "1.7.0"

# Internal crates (versioned so cargo-deny's wildcard check passes)
gusset-units = { path = "crates/gusset-units", version = "0.0.1" }
gusset-kernel = { path = "crates/gusset-kernel", version = "0.0.1" }
gusset-doc = { path = "crates/gusset-doc", version = "0.0.1" }
gusset-history = { path = "crates/gusset-history", version = "0.0.1" }
gusset-naming = { path = "crates/gusset-naming", version = "0.0.1" }
gusset-sketch = { path = "crates/gusset-sketch", version = "0.0.1" }
gusset-occt-sys = { path = "crates/gusset-occt-sys", version = "0.0.1" }
gusset-kernel-occt = { path = "crates/gusset-kernel-occt", version = "0.0.1" }
gusset-eval = { path = "crates/gusset-eval", version = "0.0.1" }
gusset-hw = { path = "crates/gusset-hw", version = "0.0.1" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
