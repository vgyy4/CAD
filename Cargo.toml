[workspace]
resolver = "3"
members = ["crates/*"]
# Separate cargo-fuzz crates (nightly-only, never part of the normal build).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-mvp"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vgyy4/CAD"
authors = ["Gusset contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
mem_forget = "deny"

[workspace.dependencies]
libm = "0.2.16"
blake3 = "1.8.7"
quick-xml = { version = "0.42.0", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
directories = "6.0.0"
getrandom = "0.4.3"
trash = "5.2.9"
zstd = { version = "0.14.1", default-features = false }
# gusset-hw: thread QoS/priority and sysctl FFI on Linux/Android/Apple (ADR 0011).
libc = "0.2.190"
# gusset-hw: EcoQoS (SetThreadInformation) and RAM query on Windows (ADR 0011).
windows-sys = "0.61.2"
cc = "1.7.0"
egui = "0.36.2"
# gusset-text: glyph outlines (ADR 0029); both already in the tree through egui.
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
epaint_default_fonts = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11"] }
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
landlock = "0.4.7"
seccompiler = "0.5.0"
rlimit = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
# gusset-render: wgpu viewport renderer (ADR 0009). Web backends off; the native
# backends (Vulkan, DX12, Metal, GL) stay on for the fallback chain.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
# gusset-render: PNG encoding for render_view and screenshot goldens.
png = "0.18.1"
# gusset-mcp: the official MCP Rust SDK (Apache-2.0), pinned exactly (ADR 0012).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "elicitation"] }
# gusset-host / gusset-mcp: async runtime and the localhost HTTP stack (already pulled
# in by rmcp's streamable-HTTP transport; listed so we can enable server/client parts).
tokio = { version = "1.53.2", default-features = false }
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = "0.7.20"
# gusset-update: minisign (Ed25519) signature verification, MIT, no dependencies and no
# unsafe code (ADR 0014; reviewed 2026-10-10).
minisign-verify = "0.3.0"
# gusset-update: version ordering for update checks (dtolnay/semver, MIT OR Apache-2.0).
semver = "1.0.28"

# Internal crates (versioned so cargo-deny's wildcard check passes)
gusset-units = { path = "crates/gusset-units", version = "0.1.0-mvp" }
gusset-kernel = { path = "crates/gusset-kernel", version = "0.1.0-mvp" }
gusset-kernel-remote = { path = "crates/gusset-kernel-remote", version = "0.1.0-mvp" }
gusset-kernel-worker = { path = "crates/gusset-kernel-worker", version = "0.1.0-mvp" }
gusset-doc = { path = "crates/gusset-doc", version = "0.1.0-mvp" }
gusset-history = { path = "crates/gusset-history", version = "0.1.0-mvp" }
gusset-naming = { path = "crates/gusset-naming", version = "0.1.0-mvp" }
gusset-sketch = { path = "crates/gusset-sketch", version = "0.1.0-mvp" }
gusset-text = { path = "crates/gusset-text", version = "0.1.0-mvp" }
gusset-scad = { path = "crates/gusset-scad", version = "0.1.0-mvp" }
gusset-occt-sys = { path = "crates/gusset-occt-sys", version = "0.1.0-mvp" }
gusset-kernel-occt = { path = "crates/gusset-kernel-occt", version = "0.1.0-mvp" }
gusset-eval = { path = "crates/gusset-eval", version = "0.1.0-mvp" }
gusset-drawing = { path = "crates/gusset-drawing", version = "0.1.0-mvp" }
gusset-hw = { path = "crates/gusset-hw", version = "0.1.0-mvp" }
gusset-commands = { path = "crates/gusset-commands", version = "0.1.0-mvp" }
gusset-store = { path = "crates/gusset-store", version = "0.1.0-mvp" }
gusset-meshio = { path = "crates/gusset-meshio", version = "0.1.0-mvp" }
gusset-project = { path = "crates/gusset-project", version = "0.1.0-mvp" }
gusset-cli = { path = "crates/gusset-cli", version = "0.1.0-mvp" }
gusset-sandbox = { path = "crates/gusset-sandbox", version = "0.1.0-mvp" }
gusset-worker = { path = "crates/gusset-worker", version = "0.1.0-mvp" }
gusset-app = { path = "crates/gusset-app", version = "0.1.0-mvp" }
gusset-render = { path = "crates/gusset-render", version = "0.1.0-mvp" }
gusset-host = { path = "crates/gusset-host", version = "0.1.0-mvp" }
gusset-mcp = { path = "crates/gusset-mcp", version = "0.1.0-mvp" }
gusset-update = { path = "crates/gusset-update", version = "0.1.0-mvp" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
# Line tables keep backtraces useful at a fraction of full debug info's disk use.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
