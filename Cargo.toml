[workspace]
resolver = "3"
members = ["crates/*"]
# Separate cargo-fuzz crates (nightly-only, never part of the normal build).
exclude = ["crates/gusset-store/fuzz", "crates/gusset-meshio/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vgyy4/CAD"
authors = ["Gusset contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
mem_forget = "deny"

[workspace.dependencies]
libm = "0.2.16"
blake3 = "1.8.7"
quick-xml = { version = "0.42.0", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
directories = "6.0.0"
getrandom = "0.4.3"
trash = "5.2.9"
zstd = { version = "0.14.1", default-features = false }
# gusset-hw: thread QoS/priority and sysctl FFI on Linux/Android/Apple (ADR 0011).
libc = "0.2.190"
# gusset-hw: EcoQoS (SetThreadInformation) and RAM query on Windows (ADR 0011).
windows-sys = "0.61.2"
cc = "1.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
# gusset-mcp: the official MCP Rust SDK (Apache-2.0), pinned exactly (ADR 0012).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "elicitation"] }
# gusset-host / gusset-mcp: async runtime and the localhost HTTP stack (already pulled
# in by rmcp's streamable-HTTP transport; listed so we can enable server/client parts).
tokio = { version = "1.53.2", default-features = false }
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = "0.7.20"

# Internal crates (versioned so cargo-deny's wildcard check passes)
gusset-units = { path = "crates/gusset-units", version = "0.0.1" }
gusset-kernel = { path = "crates/gusset-kernel", version = "0.0.1" }
gusset-doc = { path = "crates/gusset-doc", version = "0.0.1" }
gusset-history = { path = "crates/gusset-history", version = "0.0.1" }
gusset-naming = { path = "crates/gusset-naming", version = "0.0.1" }
gusset-sketch = { path = "crates/gusset-sketch", version = "0.0.1" }
gusset-occt-sys = { path = "crates/gusset-occt-sys", version = "0.0.1" }
gusset-kernel-occt = { path = "crates/gusset-kernel-occt", version = "0.0.1" }
gusset-eval = { path = "crates/gusset-eval", version = "0.0.1" }
gusset-hw = { path = "crates/gusset-hw", version = "0.0.1" }
gusset-commands = { path = "crates/gusset-commands", version = "0.0.1" }
gusset-store = { path = "crates/gusset-store", version = "0.0.1" }
gusset-meshio = { path = "crates/gusset-meshio", version = "0.0.1" }
gusset-project = { path = "crates/gusset-project", version = "0.0.1" }
gusset-host = { path = "crates/gusset-host", version = "0.0.1" }
gusset-mcp = { path = "crates/gusset-mcp", version = "0.0.1" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
