name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The fuzz crate is outside the workspace (fuzz-miri.yml runs it on nightly);
      # lint it here on the pinned stable toolchain too.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, optional: false }
          - { name: linux-arm64, os: ubuntu-24.04-arm, optional: false }
          - { name: windows-x64, os: windows-2025, optional: false }
          - { name: windows-arm64, os: windows-11-arm, optional: false }
          - { name: macos-arm64, os: macos-15, optional: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - name: Install a software Vulkan/GL adapter (renderer GPU golden tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libegl1 libegl-mesa0
      - run: cargo build --workspace --locked
      - name: GPU tests one at a time with output (shows which adapter a crash is in)
        run: cargo test -p gusset-render --test gpu --locked -- --test-threads=1 --nocapture
      - name: cargo test --workspace --locked
        # On Linux lavapipe/llvmpipe are installed above, so a missing adapter is a
        # failure there instead of a skipped GPU test.
        env:
          GUSSET_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

  licenses:
    # THIRD_PARTY_LICENSES.md must match what cargo-about generates from Cargo.lock
    # (ADR 0001); regenerate it with the command in about.toml.
    name: third-party license inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo-about
          key: cargo-about-0.9.2-${{ runner.os }}-v3
      # Installed into its own root and run by path, so the step cannot pick up (or miss)
      # a cargo-about elsewhere on PATH.
      - run: test -x ~/.cargo-about/bin/cargo-about || cargo install cargo-about --version 0.9.2 --locked --force --root ~/.cargo-about
      - run: cargo fetch --locked
      - run: ~/.cargo-about/bin/cargo-about about generate --frozen --workspace -o THIRD_PARTY_LICENSES.md about.hbs
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.md

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  occt:
    # Builds the pinned OCCT natively on every target (cached), then runs the kernel,
    # golden-geometry and CLI end-to-end tests against it (ADR 0002 hard criterion).
    name: occt kernel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, optional: false }
          - { name: linux-arm64, os: ubuntu-24.04-arm, optional: false }
          - { name: windows-x64, os: windows-2025, optional: false }
          - { name: windows-arm64, os: windows-11-arm, optional: false }
          - { name: macos-arm64, os: macos-15, optional: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Restore OCCT build
        id: occt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ matrix.name }}-${{ hashFiles('deps/occt/**') }}
      - name: Build OCCT (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: deps/occt/build-occt.sh "$RUNNER_TEMP/occt-install"
      - name: Point the build at OCCT
        run: |
          echo "GUSSET_OCCT_DIR=$RUNNER_TEMP/occt-install" >> "$GITHUB_ENV"
          # Windows test executables find the DLLs through PATH (dev/CI only; the
          # shipped app loads them by absolute path, ADR 0008).
          echo "$RUNNER_TEMP/occt-install/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: occt-${{ matrix.name }}
      - run: cargo clippy -p gusset-occt-sys -p gusset-kernel-occt -p gusset-cli -p gusset-worker --all-targets --locked -- -D warnings
      # The CLI tests run `gusset`, which starts `gusset-worker` from its own directory.
      - run: cargo build -p gusset-cli -p gusset-worker --bins --locked
      - name: Put the OCCT DLLs next to the binaries (Windows)
        if: runner.os == 'Windows'
        # The binaries are linked with /DEPENDENTLOADFLAG (System32 + application
        # directory only, security review #2), so PATH is not searched for them.
        run: cp "$RUNNER_TEMP"/occt-install/bin/*.dll target/debug/
      - run: cargo test -p gusset-occt-sys -p gusset-kernel-occt -p gusset-cli -p gusset-worker --locked
      - run: cargo run -p gusset-cli --locked -- self-test
