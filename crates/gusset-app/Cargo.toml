[package]
name = "gusset-app"
description = "The Gusset desktop application (egui/eframe, ADR 0009)"
version.workspace = true
edition.workspace = true
# egui 0.36 requires Rust 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

[[bin]]
name = "gusset-gui"
path = "src/main.rs"

[dependencies]
gusset-units.workspace = true
gusset-doc.workspace = true
gusset-kernel.workspace = true
gusset-kernel-occt.workspace = true
# Direct dependency only so build.rs receives DEP_GUSSET_OCCT_LIB_DIR: GNU ld (Linux
# arm64) resolves OCCT's inter-library dependencies through the RPATH.
gusset-occt-sys.workspace = true
gusset-history.workspace = true
gusset-eval.workspace = true
gusset-commands.workspace = true
gusset-project.workspace = true
gusset-store.workspace = true
gusset-hw.workspace = true
gusset-render.workspace = true
gusset-host.workspace = true
gusset-worker.workspace = true
gusset-kernel-worker.workspace = true
gusset-mcp = { workspace = true, features = ["render"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[lints]
workspace = true
