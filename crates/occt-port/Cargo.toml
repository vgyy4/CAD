# A translation of OCCT is a derivative work of it: same license as OCCT. Linked only
# into the kernel worker process, never into the app (ADR 0025 §3).
license = "LGPL-2.1-only WITH OCCT-exception-1.0"
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
libm.workspace = true

