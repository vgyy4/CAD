[package]
name = "gusset-worker"
description = "Out-of-process, sandboxed importer for STEP/IGES (ADR 0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "gusset-worker"
path = "src/main.rs"

[dependencies]
gusset-occt-sys.workspace = true
gusset-sandbox.workspace = true
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The integration tests build shapes with the kernel. (gusset-kernel-occt depends on
# this crate's library for the B-rep gate; a dev-dependency cycle is fine.)
gusset-kernel.workspace = true
gusset-kernel-occt.workspace = true

[lints]
workspace = true
