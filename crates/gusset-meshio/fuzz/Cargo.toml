[package]
name = "gusset-meshio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
# rust-fuzz/libfuzzer, (MIT OR Apache-2.0) AND NCSA; no RustSec advisories (checked 2026-10-10).
libfuzzer-sys = "0.4.13"
gusset-meshio = { path = ".." }
gusset-kernel = { path = "../../gusset-kernel" }

# Not part of the main workspace (listed in the root `exclude`).
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "import_stl"
path = "fuzz_targets/import_stl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_obj"
path = "fuzz_targets/import_obj.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_3mf"
path = "fuzz_targets/import_3mf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_any"
path = "fuzz_targets/import_any.rs"
test = false
doc = false
bench = false
