[package]
name = "gusset-hw"
description = "Hardware detection, CPU-feature dispatch, quality tiers and resource budgets for Gusset"
version.workspace = true
edition.workspace = true
# 1.89: AVX-512 target features and `avxvnni` detection are stable from 1.89; safe
# `#[target_feature]` fns need 1.86. Checked with `cargo +1.89 check`. See ADR 0011.
rust-version = "1.89"
license.workspace = true
repository.workspace = true

[[bin]]
name = "gen-hardware-doc"
path = "src/bin/gen-hardware-doc.rs"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

# This crate cannot use `lints.workspace = true`: the workspace *forbids* `unsafe_code`,
# and a forbid cannot be relaxed for the few isolated FFI / target-feature call sites
# (`src/sys/*` and the checked call sites generated by `variant!` in `src/kernels.rs`).
# Everything else mirrors the workspace table; `unsafe_code` is `deny` here and the
# crate root repeats `#![deny(unsafe_code)]`.
# Keep in sync with `[workspace.lints]` in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
