allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true

# PROMPT.md "Determinism": model-defining math must give the same bits on every platform.
# std's f64 transcendental functions call the platform libm (glibc, MSVC and Apple differ in
# the last ulp); use the `libm` crate instead (review v0.2 M5). Display-only crates opt out
# with `#![allow(clippy::disallowed_methods)]` at the crate root and say why.
disallowed-methods = [
    { path = "f64::sin", reason = "not deterministic across platforms: use libm::sin (PROMPT.md Determinism)" },
    { path = "f64::cos", reason = "not deterministic across platforms: use libm::cos (PROMPT.md Determinism)" },
    { path = "f64::tan", reason = "not deterministic across platforms: use libm::tan (PROMPT.md Determinism)" },
    { path = "f64::asin", reason = "not deterministic across platforms: use libm::asin (PROMPT.md Determinism)" },
    { path = "f64::acos", reason = "not deterministic across platforms: use libm::acos (PROMPT.md Determinism)" },
    { path = "f64::atan", reason = "not deterministic across platforms: use libm::atan (PROMPT.md Determinism)" },
    { path = "f64::atan2", reason = "not deterministic across platforms: use libm::atan2 (PROMPT.md Determinism)" },
    { path = "f64::sin_cos", reason = "not deterministic across platforms: use libm::sin/cos (PROMPT.md Determinism)" },
    { path = "f64::hypot", reason = "not deterministic across platforms: use libm::hypot (PROMPT.md Determinism)" },
    { path = "f64::exp", reason = "not deterministic across platforms: use libm::exp (PROMPT.md Determinism)" },
    { path = "f64::exp2", reason = "not deterministic across platforms: use libm::exp2 (PROMPT.md Determinism)" },
    { path = "f64::exp_m1", reason = "not deterministic across platforms: use libm::expm1 (PROMPT.md Determinism)" },
    { path = "f64::ln", reason = "not deterministic across platforms: use libm::log (PROMPT.md Determinism)" },
    { path = "f64::ln_1p", reason = "not deterministic across platforms: use libm::log1p (PROMPT.md Determinism)" },
    { path = "f64::log", reason = "not deterministic across platforms: use libm::log(x) / libm::log(base) (PROMPT.md Determinism)" },
    { path = "f64::log2", reason = "not deterministic across platforms: use libm::log2 (PROMPT.md Determinism)" },
    { path = "f64::log10", reason = "not deterministic across platforms: use libm::log10 (PROMPT.md Determinism)" },
    { path = "f64::powf", reason = "not deterministic across platforms: use libm::pow (PROMPT.md Determinism)" },
    { path = "f64::cbrt", reason = "not deterministic across platforms: use libm::cbrt (PROMPT.md Determinism)" },
    { path = "f64::sinh", reason = "not deterministic across platforms: use libm::sinh (PROMPT.md Determinism)" },
    { path = "f64::cosh", reason = "not deterministic across platforms: use libm::cosh (PROMPT.md Determinism)" },
    { path = "f64::tanh", reason = "not deterministic across platforms: use libm::tanh (PROMPT.md Determinism)" },
    { path = "f64::asinh", reason = "not deterministic across platforms: use libm::asinh (PROMPT.md Determinism)" },
    { path = "f64::acosh", reason = "not deterministic across platforms: use libm::acosh (PROMPT.md Determinism)" },
    { path = "f64::atanh", reason = "not deterministic across platforms: use libm::atanh (PROMPT.md Determinism)" },
]
