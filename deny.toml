# cargo-deny policy (ADR 0001 license policy, ADR 0008 supply chain).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is policy (ADR 0001), not an inventory; unused entries are fine.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
]
# LGPL/GPL/AGPL Rust crates are never allowed (Rust links statically). OCCT is
# LGPL-2.1 but is a C++ shared library, not a crate; see ADR 0001/0002.

# The OCCT translation pilot is LGPL like OCCT itself. It may only be linked into the
# kernel worker, a separate program, never into the app (ADR 0025; see [bans]).
[[licenses.exceptions]]
crate = "occt-port"
allow = ["LGPL-2.1-only WITH OCCT-exception-1.0"]

# Font licences, scoped to the one crate that bundles fonts (ADR 0001, "Fonts").
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # GPL-licensed solver bindings (ADR 0001)
  { crate = "slvs" },
  # Statically links LGPL OCCT (ADR 0002)
  { crate = "occt-sys" },
  { crate = "opencascade-sys" },
  # LGPL translation of OCCT: only the kernel worker process may depend on it (ADR 0025)
  { crate = "occt-port", wrappers = ["gusset-kernel-worker"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
