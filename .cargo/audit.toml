# cargo-audit configuration (CI job `cargo-audit`, `cargo audit --deny warnings`).
[advisories]
# "Unmaintained" notices only (not vulnerabilities or unsoundness) for the D-Bus crates
# that egui's accessibility support (accesskit_unix -> atspi -> zbus) pulls in on Linux.
# No maintained replacement exists upstream yet, and dropping AccessKit would remove
# screen-reader support (DESIGN.md §1.22). Revisit when eframe moves off zbus/zvariant.
# Decision recorded in docs/PROGRESS.md ("Decisions made without the owner").
ignore = [
  "RUSTSEC-2026-0370", # zvariant is unmaintained
  "RUSTSEC-2026-0371", # zbus_names is unmaintained
  "RUSTSEC-2026-0372", # zvariant_derive is unmaintained
]
